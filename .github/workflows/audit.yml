# aegis-trust dependency audit workflow (MA: Maintenance — dependency audit)
#
# Added in sprint S002 to restore the dependency-audit CI control documented
# in SECURITY.md (the M4-era ci.yml ran pip-audit; the control was lost in a
# later workflow refactor — python/CHANGELOG.md M4 entry vs ci.yml today).
#
# === SAFETY INVARIANTS (inherited from ci.yml — do not relax) ===
#
#   1. NO `pull_request_target` trigger. Use `pull_request` only.
#   2. NO `id-token: write` permission anywhere.
#   3. NO secret references. This workflow is read-only CI.
#   4. NO unpinned third-party actions. All `uses:` references use full
#      40-char commit SHA (same pins as ci.yml).
#   5. Runner: `ubuntu-latest` (GitHub-hosted ephemeral).
#   6. Fail-closed: no `|| true`, no `continue-on-error`. A vulnerability
#      finding fails the job (python/CHANGELOG.md S017 doctrine: pip-audit
#      failure must not silently continue).
#   7. Command invariants: `uv run pip-audit --strict`, `npm ci` (never
#      `npm install`), `npm audit --audit-level=low`, and the audit-gate
#      `if: always()` are load-bearing and individually test-pinned.
#
# `python/tests/adversarial/test_redteam_S002_audit_workflow.py` mechanically
# enforces invariants 1-4 + 6-7 on every run. Changing this workflow WITHOUT
# updating that test will fail CI.
#
# NOTE: the `audit-gate` aggregator below is NOT part of the `ci-gate`
# required status check. Adding it to branch protection is an operator
# decision recorded in docs/security/SECURITY_ASSESSMENT.md (S002).

name: audit

on:
  pull_request:
    branches:
      - main
      - sprint/**
  push:
    branches:
      - main
      - sprint/**
  schedule:
    # Weekly Monday 03:17 UTC: surface newly-published CVEs in unchanged code.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Same resolution path as ci.yml python-test: pinned uv + uv.lock via
      # `uv sync --extra dev` (PEP 621 extras). Auditing a pip-resolved env
      # while CI tests a uv.lock env would audit a different dependency set.
      - name: Install uv (pinned)
        run: pip install 'uv==0.5.30'

      # `--locked` is what makes "lockfile-exact" true. Without it `uv sync`
      # silently re-resolves and updates uv.lock when pyproject.toml has drifted
      # from it, so the audited dependency set would not be the locked one — the
      # exact asymmetry with `npm ci` that this job's invariant 7 exists to
      # prevent (cross-review P1, 2026-07-29).
      - name: uv sync (dev extras, lockfile-exact)
        run: uv sync --extra dev --locked

      - name: pip-audit (fail-closed)
        run: uv run pip-audit --strict

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: npm audit (fail-closed, all severities)
        run: npm audit --audit-level=low

  audit-gate:
    # Aggregator job mirroring the ci-gate pattern: a single stable check
    # name that propagates upstream job failures via `needs:`.
    runs-on: ubuntu-latest
    needs:
      - pip-audit
      - npm-audit
    if: always()
    steps:
      - name: Evaluate upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "audit-gate FAIL: at least one upstream job did not succeed."
              exit 1
            fi
          done
          echo "audit-gate PASS: all upstream jobs succeeded."
