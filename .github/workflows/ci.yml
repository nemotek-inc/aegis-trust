# aegis-trust top-level CI workflow
#
# Read-only PR/push CI: lint, type-check, and tests (Python + Node version
# matrices), a gitleaks secret scan, and version/license drift checks.
#
# === SAFETY INVARIANTS (do not relax without authorization + cross-review) ===
#
#   1. NO `pull_request_target` trigger. Use `pull_request` only.
#      Rationale: pull_request_target runs with base-repo token (secret access)
#      and is the canonical fork-PR token-theft attack vector.
#
#   2. NO `id-token: write` permission anywhere. Block A has no signing path.
#      Rationale: id-token grants OIDC for cloud auth / cosign keyless. Any
#      future enablement requires release-class authorization (Block B).
#
#   3. NO secret references. `secrets.PYPI_TOKEN`, `secrets.NPM_TOKEN`,
#      `secrets.COSIGN_*` MUST NOT appear. Block A is read-only CI.
#
#   4. NO unpinned third-party actions. All `uses:` references use full
#      40-char commit SHA (not `@v4` tags). Tag mutation = supply-chain
#      attack surface (see CVE-pattern, third-party actions, 2024).
#
#   5. Runner: `ubuntu-latest` (GitHub-hosted ephemeral). When operator
#      registers a `dedicated-runner` self-hosted runner, a future
#      1-line PR may switch `runs-on:` everywhere. Self-hosted re-enables
#      fork-PR-runs-code-as-runner-user risk; operator MUST also enable
#      Settings → Actions → "Require approval for all outside collaborators"
#      before that switch lands.
#
#   6. `ci-gate` is the SINGLE required status check on `main` + `sprint/**`.
#      Branch protection (operator post-merge action) MUST NOT add individual
#      matrix-suffixed names (`python-test (3.12)`, etc.) — the aggregator
#      job propagates failure via `needs:`.
#
# === Adversarial test enforcement ===
#
# `python/tests/adversarial/test_redteam_S018_ci_attack.py` mechanically
# enforces invariants 1-4 + ci-gate existence (invariant 6) on every run.
# Changing this workflow WITHOUT updating that test will fail CI.

name: ci

on:
  pull_request:
    branches:
      - main
      - sprint/**
  push:
    branches:
      - main
      - sprint/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (pinned)
        run: pip install 'uv==0.5.30'

      - name: uv sync (dev extras)
        working-directory: python
        # PEP 621 [project.optional-dependencies].dev → `uv sync --extra dev`.
        # `uv sync --dev` (PEP 735 [dependency-groups]) is wrong here because
        # the project uses PEP 621 extras, not PEP 735 groups.
        #
        # `--locked` fails the job instead of re-resolving when uv.lock has
        # drifted from pyproject.toml. Without it a pyproject edit can land with
        # a stale lock and CI stays green while testing a dependency set nobody
        # committed (cross-review P1, 2026-07-29).
        run: uv sync --extra dev --locked

      - name: ruff check
        working-directory: python
        run: uv run ruff check src/ tests/

      - name: ruff format --check
        working-directory: python
        run: uv run ruff format --check src/ tests/

      - name: mypy --strict (type-safety gate, parity with the release dogfood)
        # The release-time 9-verifier dogfood runs `mypy --strict` and fail-closes
        # the publish on any error. Running it here means a type error is caught
        # on the PR, not at `git tag v*` time. Scope/excludes live in
        # `[tool.mypy]` (files = src/aegis_trust). Found necessary when 0.9.2's
        # publish failed on an unused `type: ignore` that ruff + pytest let pass.
        working-directory: python
        run: uv run mypy --strict

      - name: Install opentimestamps-client (integration-test runtime dep)
        # `python/tests/test_ots_verify_external.py` invokes
        # `scripts/ots-verify-external.sh`, which requires the `ots` binary
        # from opentimestamps-client. Not in `pyproject.toml` because it is
        # a CI-runtime tool, not an SDK runtime dep. Local dev macOS users
        # typically get it via Homebrew (`brew install opentimestamps-client`).
        run: pip install opentimestamps-client

      - name: pytest
        working-directory: python
        run: uv run pytest tests/ -v --tb=short

  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Covers declared engines.node = ">=18" in node/package.json.
        # LTS lines only (skips 19, 21).
        node-version: ['18', '20', '22']
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: node/package-lock.json

      - name: npm ci
        working-directory: node
        run: |
          npm ci
          # Workaround for npm bug #4828: package-lock.json was generated on
          # a non-Linux-x64 platform (macOS arm64) and omits the platform-
          # specific Rollup binary required on this runner. `npm ci` does not
          # backfill missing optional deps. Install it explicitly so vitest /
          # tsc / vite-driven tooling can find Rollup at run time.
          npm install --no-save --no-package-lock @rollup/rollup-linux-x64-gnu

      - name: Build (regenerates dist/, required by PR #4 bin-shim regression test)
        working-directory: node
        run: npm run build

      - name: Lint (tsc --noEmit)
        working-directory: node
        run: npm run lint

      - name: vitest (full suite)
        working-directory: node
        run: npm test

      - name: MCP callable-proof runners (agent → shield → audit chain)
        # Executes both fail-closed e2e runners against the dist/ built above:
        #   tests/mcp/run_end_to_end.mjs        — 4-tool trace_id propagation
        #   tests/mcp/run_dev_agent_workflow.mjs — dev-agent policy: exact
        #     blockedFields per purpose + sentinel-value absence in audit JSONL
        # Each exits non-zero on any assertion miss, so this step fails the
        # node-test job (and ci-gate via needs:) — no extra reporting layer.
        # Audit JSONL is written to an OS tmpdir; nothing is uploaded.
        working-directory: node
        run: npm run e2e:mcp

  gitleaks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks-action v2.x requires GITHUB_TOKEN as an env var to scan PRs.
      # Block A's adversarial test (`test_redteam_S018_ci_attack.py:200-225`)
      # bans every `secrets.X` reference including `secrets.GITHUB_TOKEN`. The
      # token requirement and the test invariant are mutually exclusive, so we
      # install the gitleaks binary directly with SHA256 verification (supply-
      # chain integrity preserved without the token dependency).
      - name: Install gitleaks (SHA256-verified binary)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks scan
        run: gitleaks detect --redact --no-banner --config .gitleaks.toml

      - name: No private site-repo identity in source (kept in vars/secrets only)
        # Setup-once guard (THIS repo is public). The cross-repo site identity
        # lives ONLY in vars.SITE_SYNC_REPO (an Actions variable), never in source.
        # This fails the build if that value ever appears in a tracked file, so it
        # can never be re-committed here. The value is read from the variable and
        # is NEVER printed (only file names), so it does not leak into CI logs.
        env:
          FORBIDDEN_SITE_REPO: ${{ vars.SITE_SYNC_REPO }}
        run: |
          if [ -z "${FORBIDDEN_SITE_REPO:-}" ]; then
            echo "OK: vars.SITE_SYNC_REPO not configured; nothing to guard."
            exit 0
          fi
          if git grep -lF -- "${FORBIDDEN_SITE_REPO}" >/dev/null 2>&1; then
            echo "::error::Private site-repo identity found in tracked source — keep it in vars/secrets only. Offending files:" >&2
            git grep -lF -- "${FORBIDDEN_SITE_REPO}" >&2   # file NAMES only — never the value/matching lines
            exit 1
          fi
          echo "OK: private site-repo identity is not present in tracked source."

      - name: No internal-design-marked content in source (stays in private ops-meta)
        # Setup-once guard (THIS repo is public). Internal design / roadmap docs
        # (e.g. the future Doctor / receipt / policy primitive plans) live ONLY in
        # the private ops-meta canonical store, never in this public surface. Any
        # tracked file carrying the internal-design marker fails the build, so a
        # roadmap doc can never be merged here by anyone. The marker is assembled
        # at runtime from two literals so this workflow file does not match itself.
        # Only file NAMES are printed — never the matching content.
        run: |
          MARK="AEGIS-INTERNAL""-DESIGN"
          if git grep -lF -- "$MARK" >/dev/null 2>&1; then
            echo "::error::Internal-design-marked content found in tracked source — keep it in the private ops-meta canonical store, not in this public repo. Offending files:" >&2
            git grep -lF -- "$MARK" >&2   # file NAMES only — never the matching lines
            exit 1
          fi
          echo "OK: no internal-design-marked content in tracked source."

  drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python 3.11 (tomllib stdlib)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install packaging (PEP 440 normalization)
        run: pip install 'packaging==24.2'

      - name: License byte-identity (LICENSE vs python/LICENSE)
        run: |
          diff -q LICENSE python/LICENSE \
            || { echo "DRIFT: LICENSE != python/LICENSE; PR #3 README byte-for-byte claim broken"; exit 1; }
          echo "OK: LICENSE and python/LICENSE are byte-identical"

      - name: Python version triple coherence (VERSION / pyproject.toml / __init__.py)
        run: |
          python3 <<'PY'
          from pathlib import Path
          from packaging.version import Version
          import tomllib, re

          v_VERSION = Path("python/VERSION").read_text().strip()
          v_pyproject = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          init_src = Path("python/src/aegis_trust/__init__.py").read_text()
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_src)
          assert m is not None, "FATAL: __version__ literal not found in python/src/aegis_trust/__init__.py"
          v_init = m.group(1)

          v1, v2, v3 = Version(v_VERSION), Version(v_pyproject), Version(v_init)
          if not (v1 == v2 == v3):
              print(f"DRIFT (python): VERSION={v_VERSION!r}  pyproject={v_pyproject!r}  __init__={v_init!r}")
              print(f"  normalized: VERSION={v1}  pyproject={v2}  __init__={v3}")
              raise SystemExit(1)
          print(f"OK (python): triple matches at {v1}")
          PY

      - name: Node version triple coherence (VERSION / package.json / index.ts)
        run: |
          v_VERSION=$(cat node/VERSION | tr -d '[:space:]')
          v_package=$(node -p "require('./node/package.json').version")
          # Anchored grep so AUDIT_SCHEMA_VERSION (line 120) cannot match.
          # Expects: `export const VERSION = "x.y.z";` at line start.
          v_index=$(grep -E '^export const VERSION = ' node/src/index.ts | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$v_index" ]; then
              echo "FATAL: 'export const VERSION = ' not found at line start of node/src/index.ts"
              exit 1
          fi
          if [ "$v_VERSION" != "$v_package" ] || [ "$v_package" != "$v_index" ]; then
              echo "DRIFT (node): VERSION=$v_VERSION  package.json=$v_package  index.ts=$v_index"
              exit 1
          fi
          echo "OK (node): triple matches at $v_VERSION"

      - name: README install-command coherence (PEP 440 normalized vs pyproject.toml)
        run: |
          python3 <<'PY'
          from pathlib import Path
          from packaging.version import Version
          import tomllib, re

          readme = Path("README.md").read_text()
          pyproject_v = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          # A pinned install (`pip install 'aegis-trust==X'`, with or without --pre)
          # is OPTIONAL. Stable releases document bare `pip install aegis-trust`;
          # if a pin is present anywhere it must still match pyproject.
          m = re.search(r"pip install\s+'aegis-trust==([^']+)'", readme)
          if m:
              readme_v = m.group(1)
              if Version(readme_v) != Version(pyproject_v):
                  print(f"DRIFT: README pip pin={readme_v!r}  pyproject={pyproject_v!r}")
                  print(f"  normalized: README={Version(readme_v)}  pyproject={Version(pyproject_v)}")
                  raise SystemExit(1)
              print(f"OK (README): pip pin matches pyproject at {Version(readme_v)}")
          else:
              print(f"OK (README): no pinned install; bare `pip install aegis-trust` resolves to {Version(pyproject_v)}")
          PY

      - name: Cross-SDK version-lock (npm package.json == PyPI pyproject, PEP 440 normalized)
        # Both registries publish from the same tag on every release; if the npm
        # and PyPI versions drift in the repo, a tag would ship mismatched versions
        # to the two registries. Fail closed so the version-lock cannot silently break.
        run: |
          python3 <<'PY'
          import json, tomllib
          from pathlib import Path
          from packaging.version import Version

          node_v = json.loads(Path("node/package.json").read_text())["version"]
          py_v = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          if Version(node_v) != Version(py_v):
              print(f"DRIFT (cross-SDK version-lock): node={node_v!r}  python={py_v!r}")
              print(f"  normalized: node={Version(node_v)}  python={Version(py_v)}")
              print("  npm and PyPI publish the same version per tag — bump both together.")
              raise SystemExit(1)
          print(f"OK (cross-SDK): npm and PyPI version-locked at {Version(node_v)}")
          PY

  ci-gate:
    # Aggregator job for branch protection. Single required status check
    # name that propagates upstream matrix / job failures via `needs:`.
    # Sidesteps GitHub's matrix-suffixed check-name problem
    # (`python-test (3.12)`, etc.).
    runs-on: ubuntu-latest
    needs:
      - python-test
      - node-test
      - gitleaks
      - drift-check
    if: always()
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Aggregate upstream job results
        run: |
          python_result="${{ needs.python-test.result }}"
          node_result="${{ needs.node-test.result }}"
          gitleaks_result="${{ needs.gitleaks.result }}"
          drift_result="${{ needs.drift-check.result }}"

          echo "Upstream results:"
          echo "  python-test:  $python_result"
          echo "  node-test:    $node_result"
          echo "  gitleaks:     $gitleaks_result"
          echo "  drift-check:  $drift_result"

          if [ "$python_result"   != "success" ] \
            || [ "$node_result"    != "success" ] \
            || [ "$gitleaks_result" != "success" ] \
            || [ "$drift_result"   != "success" ]; then
              echo ""
              echo "ci-gate FAIL: at least one upstream job did not succeed."
              exit 1
          fi
          echo ""
          echo "ci-gate PASS: all upstream jobs succeeded."
