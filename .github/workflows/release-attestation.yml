# aegis-trust release-attestation workflow (Block B)
#
# Purpose: supply-chain attestation for releases — CycloneDX SBOMs, Sigstore
# cosign keyless signatures, and SDK-artifact signing attached to the GitHub
# Release, plus npm / PyPI Trusted Publisher OIDC publish on a release run (a
# pushed v* tag, or a version-bump merge to main that resolve-release tags).
#
# === SAFETY INVARIANTS (must hold) ===
#
#   1. Trigger は workflow_dispatch (manual, preview only) / tag push (`v*`) /
#      main への push (version bump merge のときだけ resolve-release job が tag を切る) の 3 つ。
#      workflow_call は **持たない** (registry の Trusted Publisher は top-level workflow
#      filename を検証するため、caller 経由では identity が変わる)。
#      pull_request_target を **使わない** (token theft 攻撃面)。
#   2. permissions に `id-token: write` を持つ — Sigstore keyless signing (cosign)
#      と GitHub native build provenance (actions/attest-build-provenance) のため。
#      Block A の ci.yml と完全分離 (ci.yml は read-only contract)。
#   3. Secrets (NPM_TOKEN / PYPI_TOKEN) は本 workflow は **使わない**。 npm publish は
#      **Block C で npm Trusted Publisher OIDC** 経由 (token なし、 id-token: write OIDC、
#      npm ≥11.5.1 で literal supported)。 PyPI publish も **PyPI Trusted Publisher
#      OIDC** 経由 (token なし、 publish-pypi-trusted-publisher job、 release run 時 =
#      tag push または version bump merge)。
#      outputs = SBOM + attestation + release artifact attach + npm/PyPI
#      release-run-only publish (resolve-release の release_tag が空なら upload 無し)。
#   4. 全 third-party action は 40-char commit SHA pin。 tag pin 禁止 (mutation attack)。
#   5. Runner = a designated self-hosted release runner (mandatory; Block B =
#      release-class, supply-chain trust core). ubuntu-latest = GitHub-hosted is
#      disallowed for release jobs (it ties the cosign keyless OIDC identity to
#      GitHub infra = a supply-chain attack surface). The runner labels are
#      supplied via the `RELEASE_RUNNER_LABELS` repository variable so the
#      concrete runner identity is not committed to source. Only ci.yml Block A
#      (read-only) is exempt and may use ubuntu-latest.
#
#   6. Runner trust boundary = repository WRITE access. Any ref that can start
#      this workflow (a push to main, a v* tag, a dispatch) runs the workflow
#      VERSION stored at that ref, so a write-capable actor can always bring
#      their own workflow to the self-hosted runner. The dispatch ref guard on
#      the self-hosted jobs prevents mistakes, not adversaries; the control is
#      repository rulesets on `main` (pull-request only) and on `v*` tags
#      (restricted creation) — owner-side settings this file cannot enforce.
# === OUTPUT (sprint_009 closure 要件) ===
#
#   - node SBOM (CycloneDX JSON) attached to release
#   - python SBOM (CycloneDX JSON) attached to release
#   - GitHub native build provenance attestation (SLSA Level 3 equivalent) for both
#   - Source-snapshot SHA recorded in attestation predicate
#
# === Block status ===
#
#   - Block A (SBOM + cosign sign-blob keyless + Release attach): ✅ wired (sprint_009)
#   - Block B Phase 2 (SDK 本体 artifact pack + cosign sign + Release attach): ✅ wired (sprint_010)
#   - Block C (npm Trusted Publisher OIDC publish + provenance + dist-tag): ✅ wired
#     (T-011-11, `if: needs.resolve-release.outputs.release_tag != ''` gated, requires npm ≥11.5.1)
#   - PyPI Trusted Publisher OIDC publish: ✅ wired (publish-pypi-trusted-publisher job, release-run-only: tag push or bump merge); PEP 740 attestations ✅ enabled (repo public 2026-06-13)
#   - Reproducible build verification: deferred (audit/integrity 系)
#
# References:
#   - https://github.com/CycloneDX/cdxgen
#   - https://github.com/actions/attest-build-provenance
#   - https://slsa.dev/spec/v1.0/levels#build-l3
#   - https://docs.sigstore.dev/cosign/overview/
#
# === Required repository configuration (maintainer, one-time) ===
#
#   To keep the release infrastructure out of public source, this workflow reads
#   it from repository-level Actions variables instead of hardcoding it:
#     - vars.RELEASE_RUNNER_LABELS   — JSON array of the self-hosted release
#         runner labels, e.g. ["self-hosted","macOS","ARM64","<runner-label>"].
#         Consumed by `runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}`.
#     - vars.AEGIS_QUALITY_GATE_PATH — absolute path to the executable
#         quality-gate script provisioned on the release runner.
#   Set both under Settings → Secrets and variables → Actions → Variables.
#   If a variable is unset, the release jobs fail closed (nothing is published)
#   rather than leaking an internal path or runner identity.

name: release-attestation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Label for the preview run only (the checked-out ref is the one selected for the dispatch; nothing is uploaded)'
        required: false
        type: string
  # Setup-once release automation (2026-09-05): a push to main whose version
  # pin CHANGED (a version-bump merge) makes the `resolve-release` job create
  # `v<version>` at the merged commit and this same run carries the release
  # through gate → SBOM → sign → pack → registry uploads. The trigger, the tag
  # creation and the uploads all live in THIS file on purpose: the registries'
  # Trusted Publisher bindings validate the top-level workflow filename, and a
  # reusable-workflow call would present the caller's identity instead.
  # A main push without a bump exits at `resolve-release` (no self-hosted job
  # runs); a pushed v* tag releases as before; workflow_dispatch stays a
  # preview run (build + sign, never upload) and is honoured only from main or
  # a v* tag — an arbitrary branch never reaches the self-hosted runner.
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write       # release artifact upload
  id-token: write       # OIDC token for Sigstore + GitHub native attestation
  attestations: write   # GitHub native attestation API

concurrency:
  # Push runs are keyed by COMMIT, not by ref: GitHub keeps one running + one
  # pending run per group and a newer pending run replaces an older pending
  # one even with cancel-in-progress: false. A group per ref would let an
  # ordinary main push cancel a queued version-bump run, whose release could
  # then never be re-detected (the next run's `before` already carries the
  # bump). Per commit, only a tag push of the very same commit shares a group
  # with the main-push run of that commit — the one pair that must not run
  # twice at once. A workflow_dispatch preview gets a group of its own
  # (run_id) so no preview can ever displace a pending release.
  group: release-attestation-${{ github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: false   # release は途中中断 NG

jobs:
  resolve-release:
    # GitHub-hosted, no secrets: decides whether THIS run releases, and which
    # tag. Green = released, or an unchanged pin whose tag exists. Release =
    # the pin CHANGED in a readable range and has no tag. Anything else (a
    # collision, an untagged pin this push did not change, an unreadable
    # range) is red with the way out printed — never a quiet skip.
    name: Resolve the release tag (bump merge → create tag; tag push → pass through)
    # Defence in depth: a dispatch from any other ref runs nothing at all.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the version tag on a bump merge
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          SHAPE='^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
          none() { echo "[resolve-release] $1"; echo "release_tag=" >> "$GITHUB_OUTPUT"; exit 0; }
          # --- the version pin, from all six sources (they must agree) ---
          NODE_V="$(node -p "require('./node/package.json').version")"
          PY_V="$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          for src in "node/VERSION:$(tr -d '[:space:]' < node/VERSION)" \
                     "python/VERSION:$(tr -d '[:space:]' < python/VERSION)" \
                     "node/src/index.ts:$(sed -nE 's/^export const VERSION = "([^"]+)";?$/\1/p' node/src/index.ts | head -1)" \
                     "python/src/aegis_trust/__init__.py:$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' python/src/aegis_trust/__init__.py | head -1)" \
                     "python/pyproject.toml:$PY_V"; do
            [ "${src#*:}" = "$NODE_V" ] || { echo "version sources disagree: node/package.json=$NODE_V $src — not releasing" >&2; exit 2; }
          done
          case "$GITHUB_REF" in
            refs/tags/v*)
              # Only a PUSHED tag releases; a workflow_dispatch that selects a
              # tag ref is a preview like any other dispatch (never uploads).
              [ "$GITHUB_EVENT_NAME" = "push" ] || none "event $GITHUB_EVENT_NAME on $GITHUB_REF — preview only"
              TAG="${GITHUB_REF#refs/tags/}"
              printf '%s' "$TAG" | grep -Eq "$SHAPE" || { echo "pushed tag '$TAG' is not a release version" >&2; exit 2; }
              # The tag must name the version the tagged commit carries:
              # otherwise 1.9.0 artifacts would be attached to a v2.0.0
              # Release and reach PyPI under the wrong tag before npm's
              # filename check refused them.
              [ "$TAG" = "v$NODE_V" ] || { echo "pushed tag '$TAG' does not match the version pin at the tagged commit (v$NODE_V) — not releasing" >&2; exit 2; }
              echo "[resolve-release] tag push $TAG"
              echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            refs/heads/main) [ "$GITHUB_EVENT_NAME" = "push" ] || none "event $GITHUB_EVENT_NAME on main — preview only" ;;
            *) none "event $GITHUB_EVENT_NAME on $GITHUB_REF — preview only" ;;
          esac
          # --- main push: release only when the version pin CHANGED in the pushed range ---
          TAG="v$NODE_V"
          printf '%s' "$TAG" | grep -Eq "$SHAPE" || { echo "version pin '$NODE_V' is not a release version — not releasing" >&2; exit 2; }
          BEFORE="${{ github.event.before }}"
          PREV_V=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            PREV_V="$(git show "$BEFORE:node/package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)"
          fi
          # Peeled ref first (annotated tag → the commit it points at); a
          # lightweight tag has no peeled entry, so fall back to the tag ref.
          EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)"
          [ -n "$EXISTING" ] || EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [ -n "$EXISTING" ] && [ "$EXISTING" = "$GITHUB_SHA" ]; then
            # Resume: an earlier run of this same commit created the tag and
            # was cancelled or failed downstream. Uploads are idempotent
            # (npm: skip when the version exists; PyPI: skip-existing).
            echo "[resolve-release] $TAG already points at $GITHUB_SHA — resuming the release"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$EXISTING" ]; then
            # The pin's tag already exists at ANOTHER commit. A tag is never
            # moved. Unchanged pin = the ordinary state after a release
            # (green, nothing to do). A CHANGED pin is an error, not a quiet
            # skip, and so is a push whose range cannot be read: a green run
            # must never hide a bump that did not ship.
            if [ -n "$PREV_V" ] && [ "$PREV_V" = "$NODE_V" ]; then
              none "$TAG already exists at $EXISTING and the pin did not change in this push ($NODE_V) — nothing to release"
            fi
            if [ -n "$PREV_V" ]; then
              echo "version bump $PREV_V → $NODE_V merged at $GITHUB_SHA, but $TAG already exists at $EXISTING — not this commit." >&2
            else
              echo "cannot read this push's range (before=$BEFORE), and $TAG already exists at $EXISTING — not this commit — so this push cannot be classified." >&2
            fi
            echo "A tag is never moved. If $NODE_V was meant to ship from main: merge a new version, or delete the stale tag and re-run this workflow run." >&2
            exit 2
          fi
          # No tag for the pin anywhere. Release ONLY a bump that this push
          # made (readable range, pin changed). An untagged pin that this
          # push did not change, or a range that cannot be read, is an
          # inconsistency main must not carry silently: red, with the way
          # out spelled out. (A deleted tag therefore turns main red until a
          # new version is merged or the tag is pushed again.)
          if [ -z "$PREV_V" ]; then
            echo "cannot read this push's range (before=$BEFORE), and main carries $NODE_V with no $TAG on origin — cannot tell whether this push is the bump." >&2
            echo "If $NODE_V should ship: merge a new version bump (a readable range releases), or push $TAG at the intended commit." >&2
            exit 2
          fi
          if [ "$PREV_V" = "$NODE_V" ]; then
            echo "main carries $NODE_V with no $TAG on origin, and this push did not change the pin — an earlier bump never shipped (or its tag was deleted)." >&2
            echo "Merge a new version bump, or push $TAG at the intended commit. Nothing is released on a push that is not the bump." >&2
            exit 2
          fi
          echo "[resolve-release] version bump $PREV_V → $NODE_V merged at $GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release $TAG (version bump $PREV_V → $NODE_V merged to main: $GITHUB_SHA)" "$GITHUB_SHA"
          # A tag pushed with GITHUB_TOKEN starts no new workflow run (GitHub
          # rule), so this run stays the only release run for this commit.
          git push origin "refs/tags/$TAG"
          echo "[resolve-release] created $TAG at $GITHUB_SHA"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  productization-gate:
    name: Productization Gate (9-verifier dogfood, fail-closed)
    needs: [resolve-release]
    if: (github.event_name == 'push' && needs.resolve-release.outputs.release_tag != '') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Verify quality gate present on the release runner
        env:
          AEGIS_QUALITY_GATE_PATH: ${{ vars.AEGIS_QUALITY_GATE_PATH }}
        run: |
          set -euo pipefail
          GATE="${AEGIS_QUALITY_GATE_PATH:?repository variable AEGIS_QUALITY_GATE_PATH is not set}"
          if [ ! -x "$GATE" ]; then
            echo "quality gate runner not found at $GATE" >&2
            echo "expected: AEGIS_QUALITY_GATE_PATH must point to an executable quality-gate script provisioned on the release runner" >&2
            exit 2
          fi
          echo "[productization-gate] runner OK: $GATE"

      - name: Build node SDK (dist/) for gate verifiers that scan compiled output
        # idempotency_guarantee invocation_runner.mjs imports from node/dist/index.js;
        # agent_callable_surface scans dist/*.d.ts. Both need a built artifact.
        # tsc must run before the verifier dogfood so a fresh-checkout runner has dist/.
        working-directory: node
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm run build
          [ -f dist/index.js ] || { echo "node dist/index.js missing after build" >&2; exit 2; }
          [ -f dist/index.d.ts ] || { echo "node dist/index.d.ts missing after build" >&2; exit 2; }
          echo "[productization-gate] node dist/ built ($(ls dist | wc -l | tr -d ' ') files)"

      - name: Run 9-verifier dogfood (P0 fail-closed; pending P1 accepted)
        env:
          AEGIS_QUALITY_GATE_PATH: ${{ vars.AEGIS_QUALITY_GATE_PATH }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-release.outputs.release_tag }}"
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "release_tag '$TAG' is not a release version" >&2; exit 2
          fi
          # Gate label only. A branch ref does not start with refs/tags/, so
          # strip only when it is a tag ref; otherwise use the dispatch label.
          if [ -z "$TAG" ]; then case "$GITHUB_REF" in refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;; esac; fi
          [ -n "$TAG" ] || TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="manual-dispatch"
          bash "${AEGIS_QUALITY_GATE_PATH:?repository variable AEGIS_QUALITY_GATE_PATH is not set}" "$TAG" "$GITHUB_WORKSPACE"

  sbom-node:
    name: SBOM (Node — CycloneDX)
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    needs: [resolve-release, productization-gate]
    if: (github.event_name == 'push' && needs.resolve-release.outputs.release_tag != '') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    outputs:
      sbom-path: ${{ steps.gen.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Install Node deps (production only)
        working-directory: node
        run: npm ci --omit=dev

      - name: Generate CycloneDX SBOM (Node)
        id: gen
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cdxgen via npx (no global install)、 CycloneDX v1.5 JSON format
          npx -y @cyclonedx/cdxgen@10 \
            --type js \
            --output sbom/aegis-trust-node.cdx.json \
            --spec-version 1.5 \
            node/
          echo "sbom-path=sbom/aegis-trust-node.cdx.json" >> "$GITHUB_OUTPUT"
          echo "[sbom-node] generated $(wc -l < sbom/aegis-trust-node.cdx.json) lines"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-node
          path: sbom/aegis-trust-node.cdx.json
          retention-days: 90

  sbom-python:
    name: SBOM (Python — CycloneDX)
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    needs: [resolve-release, productization-gate]
    if: (github.event_name == 'push' && needs.resolve-release.outputs.release_tag != '') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    outputs:
      sbom-path: ${{ steps.gen.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node (for cdxgen)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Verify system Python (self-hosted runner)
        # actions/setup-python hardcodes the hosted-runner toolcache as the
        # macOS install target (install-python.sh "Creating Python hostedtoolcache
        # folder..." → `mkdir the hosted-runner home` → Permission denied on self-hosted
        # runner whose home is not the hosted-runner home). Setting AGENT_TOOLSDIRECTORY /
        # RUNNER_TOOL_CACHE in the runner launchd plist did not override the
        # hardcoded path (verified on the self-hosted runner).
        # SBOM generation only needs python3 in PATH for cdxgen subprocess
        # invocation (Python is not the executor — cdxgen is node-launched);
        # system Python from /opt/homebrew/bin is sufficient and avoids the
        # setup-python hostedtoolcache trap entirely.
        run: |
          set -euo pipefail
          which python3
          python3 --version

      - name: Generate CycloneDX SBOM (Python via cdxgen)
        id: gen
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cdxgen は --type python で pyproject.toml + lock 系 auto-detect
          # cyclonedx-bom CLI は v7 で flag 仕様変更 (--schema-version 不認識) のため
          # 既に sbom-node で実績ある cdxgen に統一 (single tool variance 0)
          npx -y @cyclonedx/cdxgen@10 \
            --type python \
            --output sbom/aegis-trust-python.cdx.json \
            --spec-version 1.5 \
            python/
          echo "sbom-path=sbom/aegis-trust-python.cdx.json" >> "$GITHUB_OUTPUT"
          echo "[sbom-python] generated $(wc -l < sbom/aegis-trust-python.cdx.json) lines"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-python
          path: sbom/aegis-trust-python.cdx.json
          retention-days: 90

  collect-and-sign:
    name: Cosign sign SBOMs + Release attach
    needs: [resolve-release, sbom-node, sbom-python]
    if: (github.event_name == 'push' && needs.resolve-release.outputs.release_tag != '') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag || github.ref }}

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: sbom-input

      - name: Collect SBOMs into single dir
        run: |
          set -euo pipefail
          mkdir -p sbom
          find sbom-input -name '*.cdx.json' -exec cp {} sbom/ \;
          ls -la sbom/

      # Sigstore cosign keyless signing — private repo でも動作 (OIDC + Rekor 公開 log)。
      # GitHub native attest-build-provenance は user-owned private repo 非対応のため
      # cosign 経由で SLSA-equivalent signing 実現。 keyless = no key 管理 overhead。
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v3.10.0 (real SHA verified via gh api)
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign sign SBOMs (keyless, Sigstore Rekor)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for sbom in sbom/*.cdx.json; do
            echo "[cosign] signing $sbom (keyless)"
            cosign sign-blob --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "$sbom"
            echo "[cosign] verifying $sbom"
            cosign verify-blob \
              --certificate "${sbom}.pem" \
              --signature "${sbom}.sig" \
              --certificate-identity-regexp 'https://github\.com/.+/.github/workflows/release-attestation\.yml@.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$sbom"
          done
          ls -la sbom/

      - name: Upload signed SBOM bundle as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-signed
          path: sbom/*
          retention-days: 90

      - name: Upload SBOMs + signatures to Release (release runs only)
        if: needs.resolve-release.outputs.release_tag != ''
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          files: |
            sbom/*.cdx.json
            sbom/*.sig
            sbom/*.pem
          fail_on_unmatched_files: true

  # === Block B Phase 2 (sprint_010 T-010-5) =========================================
  # SDK 本体 artifact (npm tarball + PyPI wheel) を cosign keyless で署名。
  # SBOM 署名 (上の collect-and-sign job) だけでは顧客が `npm install aegis-trust` /
  # `pip install aegis-trust` した時に検証できるのは「dependency 一覧」 のみで、
  # SDK 本体の正当性 (= 顧客が真に検証したい trust signal) は未 cover。 本 job が
  # SDK artifact 自体を sign することで「artifact = signed-by-aegis-org の同一性」
  # を Sigstore Rekor public log に literal 記録 → enterprise procurement (CSO /
  # supply-chain auditor) が `cosign verify-blob` で literal 検証可能に。
  #
  # Phase 2 scope:
  #   - npm pack で aegis-trust-<version>.tgz を build
  #   - python -m build で aegis_trust-<version>-py3-none-any.whl + .tar.gz を build
  #   - cosign sign-blob keyless で 3 artifact (tgz + whl + sdist) を署名
  #   - upload signed bundle + release attach (release run 時: tag push / bump merge)
  #
  # Done since: npm publish --provenance (Block C, publish-npm-trusted-publisher)
  #   and PyPI PEP 740 attestations (publish-pypi-trusted-publisher).
  # Not yet:
  #   - Reproducible build verification
  #
  pack-and-sign-sdk:
    name: Pack + Cosign sign SDK artifacts (npm tarball + PyPI wheel/sdist)
    needs: [resolve-release, sbom-node, sbom-python]
    if: (github.event_name == 'push' && needs.resolve-release.outputs.release_tag != '') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Verify system Python (self-hosted runner)
        # actions/setup-python hardcodes the hosted-runner toolcache as the
        # macOS install target (install-python.sh "Creating Python hostedtoolcache
        # folder..." → `mkdir the hosted-runner home` → Permission denied on self-hosted
        # runner whose home is not the hosted-runner home). Setting AGENT_TOOLSDIRECTORY /
        # RUNNER_TOOL_CACHE in the runner launchd plist did not override the
        # hardcoded path (verified on the self-hosted runner).
        # SBOM generation only needs python3 in PATH for cdxgen subprocess
        # invocation (Python is not the executor — cdxgen is node-launched);
        # system Python from /opt/homebrew/bin is sufficient and avoids the
        # setup-python hostedtoolcache trap entirely.
        run: |
          set -euo pipefail
          which python3
          python3 --version

      - name: Install Python build tools (PEP 668 break-system-packages for Homebrew Python)
        # macOS Homebrew Python 3.11+ enforces PEP 668 (externally-managed-environment):
        # `pip install ...` directly into system site-packages → crash with
        # `error: externally-managed-environment`. The release-only context
        # (ephemeral runner job, no long-lived environment to protect) allows
        # `--break-system-packages` safely. Alternative would be a venv per job;
        # break-system-packages is simpler and well-scoped here.
        # Use `python3 -m pip` to bind to the python3 we just verified, not a
        # potentially-missing unversioned `pip` (Homebrew installs only `pip3`).
        run: python3 -m pip install --no-cache-dir --break-system-packages build hatchling

      - name: Build npm tarball
        working-directory: node
        run: |
          set -euo pipefail
          # devDeps (typescript / tsc) required for `npm run build`; --omit=dev
          # would skip them and produce `sh: tsc: command not found` (verified
          # on dry-run #26349851993, 2026-05-24). Use the full install for the
          # build step; the published tarball only contains the compiled dist/
          # so the runtime install set is unaffected.
          npm ci
          npm run build
          rm -f aegis-trust-*.tgz
          npm pack
          ls -la aegis-trust-*.tgz

      - name: Build PyPI wheel + sdist
        working-directory: python
        run: |
          set -euo pipefail
          # python3 (versioned) to match the rest of the job — Homebrew Python
          # installs `python3` only, no unversioned `python` symlink.
          python3 -m build
          ls -la dist/

      - name: Collect SDK artifacts into single dir
        run: |
          set -euo pipefail
          mkdir -p sdk-artifacts
          cp node/aegis-trust-*.tgz sdk-artifacts/
          cp python/dist/aegis_trust-*.whl sdk-artifacts/
          cp python/dist/aegis_trust-*.tar.gz sdk-artifacts/
          ls -la sdk-artifacts/

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign sign SDK artifacts (keyless, Sigstore Rekor)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for artifact in sdk-artifacts/*; do
            case "$artifact" in
              *.sig|*.pem) continue ;;
            esac
            echo "[cosign] signing $artifact (keyless)"
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
            echo "[cosign] verifying $artifact"
            cosign verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity-regexp 'https://github\.com/.+/.github/workflows/release-attestation\.yml@.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$artifact"
          done
          ls -la sdk-artifacts/

      - name: Upload signed SDK artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdk-artifacts-signed
          path: sdk-artifacts/*
          retention-days: 90

      - name: Upload SDK artifacts + signatures to Release (release runs only)
        if: needs.resolve-release.outputs.release_tag != ''
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          files: |
            sdk-artifacts/*.tgz
            sdk-artifacts/*.whl
            sdk-artifacts/*.tar.gz
            sdk-artifacts/*.sig
            sdk-artifacts/*.pem
          fail_on_unmatched_files: true

      # === Block C build artifact handoff for github-hosted publish ==
      # npm Trusted Publisher provenance (--provenance flag + OIDC) is rejected
      # by the registry when run from a self-hosted runner: literal error from
      # npm 11.x registry side is `422 Unprocessable Entity - Error verifying
      # sigstore provenance bundle: Unsupported GitHub Actions runner
      # environment: "self-hosted". Only "github-hosted" runners are supported
      # when publishing with provenance.` (literal observed on run 26353133043
      # against the self-hosted runner).
      #
      # Block C is therefore split across two jobs:
      #   - pack-and-sign-sdk (this self-hosted job): build + cosign keyless
      #     sign-blob + GitHub Release attach. Stays on the self-hosted runner
      #     so cosign keyless OIDC identity does NOT depend on GitHub-hosted
      #     infra (SAFETY INVARIANT #5 preserved).
      #   - publish-npm-trusted-publisher (github-hosted ubuntu-latest job
      #     below): npm publish --provenance via Trusted Publisher OIDC.
      #     Receives the already-cosign-signed .tgz via upload-artifact /
      #     download-artifact handoff so the artifact ingested by the
      #     publish step is byte-identical to the one cosign signed on
      #     self-hosted.
      - name: Upload .tgz for github-hosted publish job (Block C handoff)
        if: needs.resolve-release.outputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-tarball-for-publish
          path: sdk-artifacts/aegis-trust-*.tgz
          retention-days: 1
          if-no-files-found: error

      - name: Upload python wheel + sdist for github-hosted PyPI publish (Trusted Publisher handoff)
        if: needs.resolve-release.outputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-dist-for-publish
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  # === Block C publish job (github-hosted) ============================================
  # Runs ONLY on a release run (pushed v* tag, or a version-bump merge to main
  # that resolve-release tagged). Receives the cosign-signed .tgz from pack-and-sign-sdk
  # via download-artifact, then publishes to npm with Trusted Publisher OIDC +
  # --provenance. github-hosted runner is mandatory here because npm registry
  # 422-rejects --provenance from self-hosted runners (see comment in
  # pack-and-sign-sdk above).
  #
  # SAFETY INVARIANT #5 boundary: cosign keyless OIDC identity stays on
  # self-hosted (signing path). npm registry OIDC happens on github-hosted
  # (token exchange, distinct identity, audited via npm Trusted Publisher
  # cert-identity regexp tied to this exact workflow file). No cosign on
  # github-hosted, no signing keys on github-hosted.
  publish-npm-trusted-publisher:
    name: npm publish (Trusted Publisher OIDC, github-hosted, --provenance)
    concurrency:
      # Serialise npm uploads ACROSS runs: the dist-tag decision below reads
      # the registry, and two overlapping release runs must not both read
      # before either writes. The running upload is never cancelled; when a
      # third release arrives, GitHub cancels the PENDING (second) one — that
      # run's job ends as cancelled and its re-run resumes (uploads are
      # idempotent; its PyPI upload may already have succeeded).
      group: aegis-trust-npm-upload
      cancel-in-progress: false
    if: needs.resolve-release.outputs.release_tag != ''
    needs: [resolve-release, pack-and-sign-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for npm Trusted Publisher (token exchange only)
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Download cosign-signed .tgz from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-tarball-for-publish
          path: tarball

      - name: Setup Node 24 (npm ≥11.5.1 required for Trusted Publisher OIDC)
        # Node 20 ships npm 10.x; OIDC token exchange requires npm >= 11.5.1.
        # registry-url is deliberately omitted: setting it auto-generates
        # .npmrc with _authToken=${NODE_AUTH_TOKEN}, but Trusted Publisher
        # OIDC does not set NODE_AUTH_TOKEN -> npm CLI crashes before the
        # OIDC exchange even starts.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: npm publish via Trusted Publisher OIDC (--provenance, public repo)
        # --provenance is ENABLED: aegis-trust is now a PUBLIC repository
        # (gh repo view → visibility=PUBLIC, 2026-06-13), so the npm registry
        # accepts the sigstore provenance bundle. The earlier omission was a
        # private-repo constraint — npm 422'd provenance from private repos
        # ("Unsupported GitHub Actions source repository visibility: 'private'.
        # Only public source repositories are supported when publishing with
        # provenance.", run 26353466944 2026-05-24). That constraint is gone
        # now the repo is public. The github-hosted runner + id-token: write
        # (this job) supply the OIDC identity the provenance attestation binds
        # to. Customer-side: `npm audit signatures` now verifies the published
        # tarball's provenance in addition to the cosign verify-blob path
        # (Block B Phase 2). Token-free Trusted Publisher OIDC is unchanged
        # (no token / OTP / recovery code consumed).
        working-directory: tarball
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="rc"
            echo "[npm] pre-release version $VERSION → publishing with --tag rc"
          else
            DIST_TAG="latest"
            echo "[npm] stable version $VERSION → publishing with --tag latest"
            # Two release runs for different commits may overlap (they never
            # share a concurrency group). `latest` must never move backwards:
            # a stable version that is not the highest one on the registry is
            # published under `previous` instead. If the registry cannot be
            # read, the job stops (never guesses) and a re-run resumes it.
            VERSIONS_JSON="$(npm view aegis-trust versions --json)" || {
              echo "[npm] cannot read the registry's version list — refusing to guess the dist-tag (re-run when the registry answers)" >&2; exit 2; }
            NEWEST="$(printf '%s' "$VERSIONS_JSON" | node -e '
              const mine = process.argv[1];
              const vs = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const stable = (Array.isArray(vs) ? vs : [vs]).concat([mine]).filter(v => /^\d+\.\d+\.\d+$/.test(v));
              const key = v => v.split(".").map(Number);
              stable.sort((a, b) => { const x = key(a), y = key(b); return (x[0] - y[0]) || (x[1] - y[1]) || (x[2] - y[2]); });
              process.stdout.write(stable.pop() || mine);
            ' "$VERSION")"
            [ -n "$NEWEST" ] || { echo "[npm] could not parse the registry's version list — refusing to guess the dist-tag" >&2; exit 2; }
            if [ "$NEWEST" != "$VERSION" ]; then
              DIST_TAG="previous"
              echo "[npm] $NEWEST is already the highest stable version on the registry → publishing $VERSION with --tag previous (latest never moves backwards)"
            fi
          fi
          TGZ="aegis-trust-${VERSION}.tgz"
          if [ ! -f "$TGZ" ]; then
            echo "ERROR: expected tarball $TGZ not found in tarball/" >&2
            ls -la
            exit 1
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          if npm view "aegis-trust@$VERSION" version >/dev/null 2>&1; then
            echo "[npm] aegis-trust@$VERSION is already on the registry — skipping the upload (resume of an earlier run)"
            echo "NPM_UPLOAD_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "[npm] publishing $TGZ with --tag $DIST_TAG --access public --provenance (OIDC, public repo)"
          npm publish "$TGZ" --tag "$DIST_TAG" --access public --provenance

      - name: npm dist-tag verify (pre-release leaves latest alone)
        # Pre-release versions (-rc, -beta, -alpha) are NOT promoted to latest
        # by THIS job. (Note: dist-tags.latest currently points at the preview
        # rc because it was promoted manually out-of-band — so bare
        # `npm install aegis-trust` resolves to the clean current rc instead of
        # an older/deprecated release. This job does not change dist-tags.)
        # The bare-install -> stable transition lands at the v1.0 GA cut.
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "[npm] post-publish dist-tag state:"
          npm dist-tag ls aegis-trust
          if [[ "$VERSION" == *-* ]]; then
            echo "[npm] pre-release $VERSION → latest tag intentionally not promoted"
          else
            if [ "${NPM_UPLOAD_SKIPPED:-}" = "1" ]; then
              # Resume: the version was uploaded by an earlier run and a newer
              # version may own `latest` by now — assert presence, not the tag.
              ON_REG="$(npm view "aegis-trust@$VERSION" version 2>/dev/null || true)"
              [ "$ON_REG" = "$VERSION" ] || { echo "[npm] $VERSION is not on the registry after a skipped upload" >&2; exit 1; }
              echo "[npm] resume: $VERSION already on the registry — dist-tag not asserted"
              exit 0
            fi
            TAG_USED="${DIST_TAG:-latest}"
            POINTS="$(npm view aegis-trust "dist-tags.$TAG_USED" 2>/dev/null || true)"
            if [ "$POINTS" != "$VERSION" ]; then
              echo "[npm] dist-tag $TAG_USED points at ${POINTS:-nothing}, expected $VERSION" >&2; exit 1
            fi
            echo "[npm] stable $VERSION → dist-tag $TAG_USED verified on the registry"
          fi

  # === PyPI Trusted Publisher publish job (github-hosted) =============================
  # Runs ONLY on a release run (pushed v* tag, or a version-bump merge to main
  # that resolve-release tagged). Receives the built wheel + sdist from pack-and-sign-sdk
  # via download-artifact, then publishes to PyPI with Trusted Publisher OIDC
  # (token-free — no API token, no ~/.pypirc). github-hosted runner is required for
  # the OIDC token exchange. PyPI Trusted Publishing works on private source repos
  # (unlike npm --provenance), so no repo-visibility constraint applies to the
  # publish itself; only PEP 740 attestations are deferred until public (below).
  #
  # SAFETY INVARIANT #5 boundary: cosign keyless signing stays on the self-hosted
  # build job (pack-and-sign-sdk). PyPI registry OIDC happens on github-hosted
  # (token exchange only, audited via the PyPI Trusted Publisher binding tied to
  # this exact workflow file). No signing keys on github-hosted.
  #
  # Maintainer one-time setup (owner-only, cannot be delegated to CI/AI): register
  # the Trusted Publisher at pypi.org → manage project `aegis-trust` → Publishing →
  # Add a GitHub publisher:
  #   owner: nemotek-inc   repository: aegis-trust   (moved from the previous owner on 2026-09-01)
  #   workflow: release-attestation.yml   environment: (leave blank)
  # Until that registration exists, this job fails at the publish step (nothing is
  # uploaded) — it does not leak anything.
  publish-pypi-trusted-publisher:
    name: PyPI publish (Trusted Publisher OIDC, github-hosted)
    if: needs.resolve-release.outputs.release_tag != ''
    needs: [resolve-release, pack-and-sign-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for PyPI Trusted Publisher (token exchange only)
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Download built wheel + sdist from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-dist-for-publish
          path: dist

      - name: Publish to PyPI via Trusted Publisher OIDC (token-free)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true       # version-lock: a tag whose PyPI version already exists is a no-op, not a failure
          attestations: true        # PEP 740 attestations: re-enabled now the repo is public (visibility=PUBLIC, 2026-06-13), mirroring npm --provenance

  # === Site registry-sync notify job (github-hosted) =================================
  # Runs ONLY on a release run, ONLY after BOTH publish jobs succeed (needs: = all must
  # pass). On a partial publish (one registry up, the other failed) this job is
  # SKIPPED — the site is never told to sync a half-published release.
  #
  # What it does:
  #   1. If the cross-repo dispatch target/token is not configured, it is a logged
  #      NO-OP and the release stays green (the wiring is inert until the
  #      maintainer adds the config — see "Required repository configuration").
  #   2. Otherwise it CONFIRMS the released version is actually visible on BOTH
  #      public registries (bounded retry), then calls the site repo's
  #      registry-sync-receiver workflow via the GitHub API (workflow_dispatch).
  #
  # NOTE: THIS repo is PUBLIC. The site repo identity is deliberately NOT
  # hardcoded here — it is supplied at runtime via repository Actions variables
  # (vars.*, not committed to source), so the private site repo's name never
  # appears in public source or git history.
  #
  # Trust boundary: the site receiver does NOT trust the version we pass — it is
  # audit text only. The site always re-fetches the live registries itself. A
  # dispatch failure here is a DISTINCT, re-runnable error: the packages are
  # already published; only the site-sync notification did not land. Re-running
  # THIS job (Actions UI -> Re-run failed jobs) retries the notify safely.
  #
  # === Required repository configuration (maintainer, one-time) — owner only ===
  #   The default GITHUB_TOKEN cannot dispatch a workflow in another repo, so
  #   provide BOTH of the following on THIS repo (Settings -> Secrets and
  #   variables -> Actions):
  #     secrets.SITE_SYNC_DISPATCH_TOKEN  — least-privilege cross-repo credential:
  #        (a) a fine-grained PAT scoped to ONLY the site repo with
  #            Actions: Read and write + Metadata: Read-only, or
  #        (b) a GitHub App installation token (App on the site repo, Actions:write).
  #     vars.SITE_SYNC_REPO               — the site repo (owner/name). A VARIABLE,
  #        not a secret and not in source, so the private repo name stays private.
  #     vars.SITE_SYNC_WORKFLOW           — receiver workflow file name
  #                                         (defaults to registry-sync-receiver.yml).
  #   Until BOTH the token AND the repo variable exist, this job is a green no-op.
  notify-site-registry-sync:
    name: Notify the marketing-site repo to sync public registry versions
    if: needs.resolve-release.outputs.release_tag != ''
    needs: [resolve-release, publish-npm-trusted-publisher, publish-pypi-trusted-publisher]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # nothing in THIS repo is written; cross-repo auth is the secret
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      # The site repo identity comes ONLY from a repository variable — never a
      # literal here — so this PUBLIC workflow does not name the private site repo.
      # The cross-repo dispatch token is injected per-step (not job-level env).
      SITE_REPO: ${{ vars.SITE_SYNC_REPO }}
      SITE_WORKFLOW: ${{ vars.SITE_SYNC_WORKFLOW || 'registry-sync-receiver.yml' }}
      PACKAGE: aegis-trust
    steps:
      - name: Skip cleanly if dispatch target/token is not configured
        id: tokcheck
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_SYNC_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ] || [ -z "${SITE_REPO:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=site-sync skipped::SITE_SYNC_DISPATCH_TOKEN (secret) and/or SITE_SYNC_REPO (variable) not configured — release unaffected; site was not notified."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "[notify] dispatch target + token present."
          fi

      - name: Confirm released version is live on BOTH registries (bounded retry)
        if: steps.tokcheck.outputs.configured == 'true'
        # CONTRACT: this job tells the SITE to mirror PUBLIC REGISTRY VERSION
        # NUMBERS. The site never mirrors artifact content — only version strings,
        # which it independently re-fetches. So the correct gate here is "is this
        # version actually live on both public registries", NOT "did THIS run
        # freshly upload it". (PyPI's skip-existing:true can succeed without an
        # upload; that is fine for a version-DISPLAY mirror because the displayed
        # number is true regardless of which run published it. Artifact / build
        # integrity is owned by the SBOM + cosign + attestation jobs above, not
        # here.) We confirm each registry INDEPENDENTLY — no npm-vs-PyPI parity.
        #
        # PEP 440: npm uses the hyphenated local form (0.9.0-rc9); PyPI stores the
        # canonical form (0.9.0rc9, 0.9.0b2, 0.9.0a1, 0.9.0.dev3). We generate the
        # canonical PyPI candidate set with a dependency-free stdlib normalizer and
        # accept a match on ANY candidate, so the confirm does not false-timeout on
        # legal pre-release spellings.
        run: |
          set -euo pipefail
          NPM_VERSION="${RELEASE_TAG#v}"            # e.g. 0.9.0-rc9 or 1.0.0
          echo "[notify] confirming ${PACKAGE} npm=${NPM_VERSION} on npm + PyPI (canonicalized)"

          # Canonical PyPI spellings for this version (pure bash + sed — no python
          # heredoc, no external deps). Split release vs pre-release on the first
          # hyphen, then map the PEP 440 pre-release spelling to its canonical form.
          REL="${NPM_VERSION%%-*}"                       # 0.9.0  (release portion)
          PRE="${NPM_VERSION#"$REL"}"; PRE="${PRE#-}"    # rc9 / beta2 / "" for stable
          if [ -z "$PRE" ]; then
            # Stable tag: the bare release form is the only valid PyPI spelling.
            PYPI_CANDS=("$NPM_VERSION" "$REL")
          else
            # Pre-release tag: do NOT accept the bare stable "$REL" (that would
            # green-light on a stable release when THIS pre-release is not live).
            PRE_NORM="$(printf '%s' "$PRE" | tr 'A-Z' 'a-z' \
              | sed -E 's/[._-]+//g; s/^alpha/a/; s/^beta/b/; s/^(preview|pre)/rc/; s/^c([0-9])/rc\1/')"
            # PEP 440 implicit zero: bare a/b/rc/dev -> a0/b0/rc0/dev0.
            case "$PRE_NORM" in a|b|rc|dev) PRE_NORM="${PRE_NORM}0" ;; esac
            PYPI_CANDS=("$NPM_VERSION" "${REL}${PRE_NORM}")   # 0.9.0rc9 / 0.9.0b2 / 1.0.0rc0
            case "$PRE_NORM" in
              dev*) PYPI_CANDS+=("${REL}.${PRE_NORM}") ;;     # PEP 440 dev form: 0.9.0.dev3
            esac
          fi
          echo "[notify] PyPI candidate spellings: ${PYPI_CANDS[*]}"

          ATTEMPTS=30   # 30 * 20s = up to 10 minutes for registry propagation
          SLEEP=20
          for i in $(seq 1 "$ATTEMPTS"); do
            NPM_OK=false; PYPI_OK=false
            NPM_JSON="$(curl -fsS "https://registry.npmjs.org/${PACKAGE}" || true)"
            if [ -n "$NPM_JSON" ] && printf '%s' "$NPM_JSON" | jq -e --arg v "$NPM_VERSION" '.versions | has($v)' >/dev/null 2>&1; then
              NPM_OK=true
            fi
            PYPI_JSON="$(curl -fsS "https://pypi.org/pypi/${PACKAGE}/json" || true)"
            if [ -n "$PYPI_JSON" ]; then
              for c in "${PYPI_CANDS[@]}"; do
                if printf '%s' "$PYPI_JSON" | jq -e --arg v "$c" '.releases | has($v)' >/dev/null 2>&1; then
                  PYPI_OK=true; break
                fi
              done
            fi
            if [ "$NPM_OK" = true ] && [ "$PYPI_OK" = true ]; then
              echo "[notify] CONFIRMED: ${PACKAGE} ${NPM_VERSION} live on npm and PyPI (attempt $i)."
              exit 0
            fi
            echo "[notify] attempt $i/$ATTEMPTS: npm_ok=$NPM_OK pypi_ok=$PYPI_OK — retrying in ${SLEEP}s"
            sleep "$SLEEP"
          done
          # Final-attempt diagnostics: which registry is unreachable vs simply not-yet-present.
          NPM_CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${PACKAGE}" || echo 000)"
          PYPI_CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PACKAGE}/json" || echo 000)"
          echo "[notify] REGISTRY-CONFIRM TIMEOUT for ${RELEASE_TAG}: npm_ok=$NPM_OK (http $NPM_CODE) pypi_ok=$PYPI_OK (http $PYPI_CODE)." >&2
          echo "[notify] Packages may still be propagating, or a registry is degraded. Re-run THIS job to retry." >&2
          exit 1

      - name: Dispatch site registry-sync receiver (workflow_dispatch via API)
        if: steps.tokcheck.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_SYNC_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          REASON="aegis-trust ${RELEASE_TAG} published (npm+PyPI confirmed live; run ${GITHUB_RUN_ID})"
          echo "[notify] dispatching ${SITE_WORKFLOW} on ${SITE_REPO}"
          if gh workflow run "${SITE_WORKFLOW}" -R "${SITE_REPO}" --ref main -f reason="${REASON}"; then
            echo "[notify] site registry-sync dispatched. The site re-fetches live registries itself;"
            echo "[notify] the version above is audit text only and is not used as a display source."
          else
            echo "[notify] DISPATCH FAILED: packages ARE published, but the site-sync notification" >&2
            echo "[notify] did not land. This is isolated from the publish jobs (already green)." >&2
            echo "[notify] Fix: verify SITE_SYNC_DISPATCH_TOKEN scope (Actions:write on ${SITE_REPO})," >&2
            echo "[notify] then Re-run THIS job. No re-publish is needed." >&2
            exit 1
          fi
