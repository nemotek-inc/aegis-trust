[tool.poetry]
name = "aegis-gateway-rest-api-client"
version = "1.0.0"
description = "A client library for accessing Aegis Gateway REST API"
authors = []
readme = "README.md"
packages = [
    { include = "aegis_gateway_rest_api_client" },
]
include = ["aegis_gateway_rest_api_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = ">=0.23.0,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
# ruff 0.16 formats code blocks inside Markdown; leave this README as generated.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["F", "I", "UP"]
